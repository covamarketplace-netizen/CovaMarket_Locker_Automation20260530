name: Report Expired Pickup Codes

# Runs daily at 23:30 MYT (15:30 UTC), read-only — no auto-cancel, no JWT.
# Emails a checklist for staff to action manually.
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  report-expired-pickups:
    runs-on: ubuntu-latest
    # Skips this entire job while Demo Mode is on (toggled via the
    # "Toggle Demo Mode" workflow) — mainly to avoid noisy/confusing
    # no-show alerts about demo activity landing in the real expiry
    # report inbox during a live demo. Shows as "skipped" in the Actions
    # UI, not failed.
    if: ${{ vars.DEMO_MODE_ACTIVE != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run report job
        env:
          XZY_APP_ID: ${{ secrets.XZY_APP_ID }}
          XZY_SECRET_KEY: ${{ secrets.XZY_SECRET_KEY }}
          GMAIL_USER: covamarketplace@gmail.com
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
        run: node report_expired_pickups.js
