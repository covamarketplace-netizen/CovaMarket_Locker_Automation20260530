name: Release Advance Pickup Codes - Slot 2 (2PM-10PM)

# Fires at 1:20 PM MYT (05:20 UTC, same calendar day). Slot 1 runs
# 9AM-1PM, so by 1:20 there's already enough buffer after its close
# for the no-show check to be accurate.
#
# Reliability note: GitHub's own scheduled triggers have been observed
# running significantly late (33 minutes on one run, 96 minutes —
# INTO slot 2's own start window — on another). Rather than stacking
# multiple GitHub-side trigger times to compensate, an external AWS
# EventBridge Scheduler rule now calls this workflow's workflow_dispatch
# trigger directly at the same time, bypassing GitHub's scheduling queue
# entirely. This GitHub-side schedule stays as a backup layer — if both
# happen to fire, that's safe (a successful release empties today's
# bucket, so whichever fires second just finds nothing left to do).
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

concurrency:
  group: release-slot-2
  cancel-in-progress: false

jobs:
  release-slot-2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve today's slot 2 bucket
        id: bucket
        run: |
          FILE=$(node release_slot.js 2)
          echo "path=$FILE" >> $GITHUB_OUTPUT
          if [ -z "$FILE" ]; then
            echo "📋 No slot 2 orders waiting for today — nothing to release."
          else
            echo "📋 Releasing: $FILE"
          fi

      - name: Generate pickup codes
        id: generate
        if: steps.bucket.outputs.path != ''
        env:
          XZY_APP_ID: ${{ secrets.XZY_APP_ID }}
          XZY_SECRET_KEY: ${{ secrets.XZY_SECRET_KEY }}
          ORDERS_FILE: ${{ steps.bucket.outputs.path }}
        run: |
          set +e
          node generate_pickup_code.js 2>&1 | tee /tmp/node_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "────────────────────────"

          grep "OUTPUT_JSON:" /tmp/node_output.txt | sed 's/OUTPUT_JSON://' > /tmp/jsons.txt
          echo "📦 JSON lines found: $(wc -l < /tmp/jsons.txt)"

          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/jsons.txt','utf8').trim().split('\n').filter(Boolean);
            const results = [];
            let firstCode = '';
            for (const l of lines) {
              try {
                const d = JSON.parse(l);
                if (d.success) {
                  results.push(d);
                  if (!firstCode) firstCode = d.pickCode || '';
                }
              } catch(e) {}
            }
            fs.writeFileSync('/tmp/success_orders.json', JSON.stringify(results));
            fs.writeFileSync('/tmp/first_pick_code.txt', firstCode);
            console.log('Parsed ' + results.length + ' successful order(s), first code: ' + firstCode);
          "

          FIRST=$(cat /tmp/first_pick_code.txt 2>/dev/null || echo "")
          echo "pick_code=$FIRST" >> $GITHUB_OUTPUT

          mkdir -p pickup_codes
          cp /tmp/success_orders.json pickup_codes/latest.json 2>/dev/null || echo "[]" > pickup_codes/latest.json

          exit $EXIT_CODE

      - name: Send pickup code emails to customers
        if: steps.bucket.outputs.path != '' && success() && steps.generate.outputs.pick_code != ''
        env:
          GMAIL_USER: covamarketplace@gmail.com
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "📧 Sending pickup code emails..."
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const orders = JSON.parse(fs.readFileSync('/tmp/success_orders.json', 'utf8'));
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+\$/;
            const validOrders = orders.filter(o => {
              const email = (o.customerEmail || '').trim();
              if (!email || email === 'N/A' || !emailRegex.test(email)) {
                console.log('  ⚠️  Skipping order ' + o.orderId + ' — no valid email');
                return false;
              }
              return true;
            });
            console.log('Sending ' + validOrders.length + ' email(s)...');
            for (const o of validOrders) {
              const env = {
                ...process.env,
                TO_EMAIL:        o.customerEmail || '',
                CUSTOMER_NAME:   o.customerName  || '',
                ORDER_ID:        o.orderId        || '',
                PICK_CODE:       o.pickCode       || '',
                LOCKER:          o.locker         || '',
                PICKUP_LOCATION: o.orderLocation  || '',
                PICKUP_DATE:     o.pickupDate     || '',
                PICKUP_TIME:     o.pickupTime     || '',
              };
              console.log('  Sending to ' + o.customerEmail + ' for order ' + o.orderId);
              execSync('node send_email.js', { env, stdio: 'inherit' });
            }
          "

      - name: Trim bucket — flag any unresolved orders for manual attention
        if: steps.bucket.outputs.path != ''
        env:
          GMAIL_USER: covamarketplace@gmail.com
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
        run: node trim_bucket_after_wave.js "${{ steps.bucket.outputs.path }}" /tmp/node_output.txt --final

      - name: Commit tracking files
        if: steps.bucket.outputs.path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pickup_codes/active_lockers.json pickup_codes/latest.json
          if [ -d advance_queue ]; then git add -f advance_queue/; fi
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Auto: release slot 2 pickup codes [skip ci]"
          # Retry push a few times — GitHub occasionally returns a
          # transient "Internal Server Error" on the remote side (not
          # caused by our data or logic). A short retry usually clears it
          # without needing manual re-triggering.
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Pushed successfully (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "❌ Push failed after 3 attempts — needs manual attention"
              exit 1
            fi
            echo "⚠️  Push attempt $attempt failed, retrying in 5s..."
            sleep 5
            git pull --rebase
          done
