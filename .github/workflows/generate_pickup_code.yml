name: Generate XYZ Vending Pickup Code

# Serialize runs — without this, two pushes close together can run at the
# same time and race over which order file gets processed, silently
# dropping one entirely. cancel-in-progress:false means queued runs wait
# their turn rather than getting cancelled.
concurrency:
  group: generate-pickup-code
  cancel-in-progress: false
  queue: max
  # queue: max FIX 2026-09-21: without this, a concurrency group only
  # holds 1 running + 1 queued job — every NEW run arriving while one is
  # already queued SILENTLY EVICTS it, with zero error, zero log. When
  # many orders arrive close together (8 files in ~2 min, confirmed
  # production 2026-09-21), most queued runs never executed at all —
  # orders #1771/#1772 vanished this way. queue: max makes every queued
  # run actually wait its turn instead of collapsing to one slot.

on:
  push:
    paths:
      - 'order_consolidation/orders_*.json'
  workflow_dispatch:  # no inputs needed — everything comes from the order JSON

jobs:
  generate-pickup-code:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # FIX 2026-09-21: on a push event, actions/checkout defaults to the
      # commit that TRIGGERED the run (github.sha), not the latest main.
      # A run that waited in the concurrency queue therefore worked from a
      # stale snapshot — it didn't see the previous run's bot commit, so
      # processed_order_ids.json didn't list the order and it was
      # processed twice (second locker + code + email + WhatsApp), then
      # the push was rejected. ref: main is resolved when the job starts,
      # i.e. after it finishes waiting, so it always sees the previous
      # run's commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # need full history to diff against github.event.before

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show current active_lockers.json
        run: |
          echo "📋 Current active_lockers.json:"
          cat pickup_codes/active_lockers.json 2>/dev/null || echo "(file does not exist yet)"

      - name: Resolve order file path
        id: order_file
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Every new order file THIS push actually added — not just
            # "newest file in the folder", which races with other pushes.
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'order_consolidation/orders_*.json')
          fi
          # Manual runs (workflow_dispatch) have no push diff to compare —
          # fall back to newest file in the folder.
          if [ -z "$FILES" ]; then
            FILES=$(ls order_consolidation/orders_*.json 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$FILES" ]; then echo "❌ No order file found in order_consolidation/"; exit 1; fi

          COUNT=$(echo "$FILES" | grep -c .)
          if [ "$COUNT" -gt 1 ]; then
            echo "📋 $COUNT new order files in this push — merging into one combined batch"
            node -e "
              const fs = require('fs');
              const files = process.argv[1].trim().split('\n');
              let combined = [];
              for (const f of files) {
                const orders = JSON.parse(fs.readFileSync(f, 'utf8'));
                combined = combined.concat(orders);
                console.log('  +' + orders.length + ' order(s) from ' + f);
              }
              fs.writeFileSync('/tmp/combined_orders.json', JSON.stringify(combined, null, 2));
              console.log('Merged ' + combined.length + ' total order(s) from ' + files.length + ' file(s)');
            " "$FILES"
            FILE="/tmp/combined_orders.json"
          else
            FILE="$FILES"
          fi

          echo "path=$FILE" >> $GITHUB_OUTPUT
          echo "📋 Using order file: $FILE"

      # ── Atomic claim — RACE FIX 2026-09-21 ────────────────────────────
      # The ref:main checkout fix and permanent processed_order_ids.json
      # both assume one run fully finishes before the next starts. That
      # assumption broke in production: two runs' JOBS genuinely
      # overlapped despite the concurrency group, both read
      # processed_order_ids.json before either had written to it, and
      # both processed order #1752 — two real codes for the same
      # physical locker. Concurrency and checkout timing can't be fully
      # trusted to prevent this. What CAN be trusted: a `git push` to the
      # same ref from two places can never both succeed — GitHub's server
      # rejects the second one, deterministically, no matter how close
      # together they were. This step uses that as the actual lock,
      # before any locker, code, email, or WhatsApp work happens.
      - name: Atomically claim orders (prevents duplicate-processing races)
        id: claim
        run: |
          node claim_orders.js "${{ steps.order_file.outputs.path }}" /tmp/claimed_orders.json
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/claimed_orders.json','utf8')).length)")
          echo "claimed_count=$COUNT" >> $GITHUB_OUTPUT
          echo "📋 Claimed $COUNT order(s) for real processing (any not listed here were already claimed elsewhere — nothing more to do for those)."


      - name: Sort & process incoming orders
        id: generate
        if: steps.claim.outputs.claimed_count != '0'
        env:
          XZY_APP_ID:     ${{ secrets.XZY_APP_ID }}
          XZY_SECRET_KEY: ${{ secrets.XZY_SECRET_KEY }}
          ORDERS_FILE:    /tmp/claimed_orders.json
        run: |
          set +e
          # Instant Pickup orders get processed immediately inside this
          # script (unchanged behavior). Advance Pickup orders get
          # bucketed by date+slot instead — no code generated here; that
          # happens later via release_slot1.yml / release_slot2.yml.
          node accumulate_advance_orders.js 2>&1 | tee /tmp/node_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "────────────────────────"

          # Extract OUTPUT_JSON lines to temp file
          grep "OUTPUT_JSON:" /tmp/node_output.txt | sed 's/OUTPUT_JSON://' > /tmp/jsons.txt
          echo "📦 JSON lines found: $(wc -l < /tmp/jsons.txt)"

          # Use node to parse results (avoids Python-in-YAML indentation issues)
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/jsons.txt','utf8').trim().split('\n').filter(Boolean);
            const results = [];
            let firstCode = '';
            for (const l of lines) {
              try {
                const d = JSON.parse(l);
                if (d.success) {
                  results.push(d);
                  if (!firstCode) firstCode = d.pickCode || '';
                }
              } catch(e) {}
            }
            fs.writeFileSync('/tmp/success_orders.json', JSON.stringify(results));
            fs.writeFileSync('/tmp/first_pick_code.txt', firstCode);
            console.log('Parsed ' + results.length + ' successful order(s), first code: ' + firstCode);
          "

          FIRST=$(cat /tmp/first_pick_code.txt 2>/dev/null || echo "")
          echo "pick_code=$FIRST" >> $GITHUB_OUTPUT
          echo "📋 First pick code: $FIRST"

          # Multiline delimiter for JSON output
          echo "success_orders<<EOF_ORDERS" >> $GITHUB_OUTPUT
          cat /tmp/success_orders.json >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF_ORDERS" >> $GITHUB_OUTPUT

          mkdir -p pickup_codes
          cp /tmp/success_orders.json pickup_codes/latest.json 2>/dev/null || echo "[]" > pickup_codes/latest.json

          echo "📋 active_lockers.json after script ran:"
          cat pickup_codes/active_lockers.json 2>/dev/null || echo "(MISSING)"

          exit $EXIT_CODE

      - name: Send pickup code emails to customers
        if: success() && steps.generate.outputs.pick_code != ''
        env:
          GMAIL_USER:     covamarketplace@gmail.com
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUCCESS_ORDERS: ${{ steps.generate.outputs.success_orders }}
        run: |
          echo "📧 Sending pickup code emails..."
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const orders = JSON.parse(fs.readFileSync('/tmp/success_orders.json', 'utf8'));
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const validOrders = orders.filter(o => {
              const email = (o.customerEmail || '').trim();
              if (!email || email === 'N/A' || !emailRegex.test(email)) {
                console.log('  ⚠️  Skipping order ' + o.orderId + ' — no valid email (got: ' + (o.customerEmail || 'empty') + ')');
                return false;
              }
              return true;
            });
            console.log('Sending ' + validOrders.length + ' email(s) (skipped ' + (orders.length - validOrders.length) + ' with missing/invalid email)...');
            for (const o of validOrders) {
              const env = {
                ...process.env,
                TO_EMAIL:        o.customerEmail || '',
                CUSTOMER_NAME:   o.customerName  || '',
                ORDER_ID:        o.orderId        || '',
                PICK_CODE:       o.pickCode       || '',
                LOCKER:          o.locker         || '',
                PICKUP_LOCATION: o.orderLocation  || '',
                PICKUP_DATE:     o.pickupDate     || '',
                PICKUP_TIME:     o.pickupTime     || '',
              };
              console.log('  Sending to ' + o.customerEmail + ' for order ' + o.orderId);
              execSync('node send_email.js', { env, stdio: 'inherit' });
            }
          "

      # ── WhatsApp sending — RE-ENABLED 2026-09-21 ─────────────────────────
      # Disabled since 2026-08-01 after hitting Twilio's free-tier daily
      # cap; the old version's inline execSync calls had no try/catch, so
      # one failure crashed this whole step and blocked every order after
      # the first. Re-enabled now on the production Twilio number with an
      # approved Content Template (HXeaa289a1ae73818d09e0f84d956ff128),
      # using the same non-blocking pattern as release_slot1/2/3.yml:
      # per-order try/catch inside the script, plus continue-on-error at
      # the step level, so a WhatsApp failure (bad number, template
      # rejected again in future, Twilio outage) can NEVER block email
      # delivery, the trim step, or the commit/push that follows.
      - name: Send pickup code WhatsApp notifications (best-effort)
        if: success() && steps.generate.outputs.pick_code != ''
        continue-on-error: true
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WA_FROM: ${{ secrets.TWILIO_WA_FROM }}
          WHATSAPP_CONTENT_SID: ${{ secrets.WHATSAPP_CONTENT_SID }}
        run: |
          echo "📱 Sending WhatsApp pickup notifications (non-blocking)..."
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const orders = JSON.parse(fs.readFileSync('/tmp/success_orders.json', 'utf8'));
            const phoneRegex = /^\+[1-9]\d{7,14}\$/;
            const validOrders = orders.filter(o => {
              const phone = (o.customerPhone || '').trim();
              if (!phone || phone === 'N/A' || !phoneRegex.test(phone)) {
                console.log('  ⚠️  Skipping WhatsApp for order ' + o.orderId + ' — no valid phone (got: ' + (o.customerPhone || 'empty') + ')');
                return false;
              }
              return true;
            });
            console.log('Attempting ' + validOrders.length + ' WhatsApp send(s)...');
            let sent = 0, failed = 0;
            for (const o of validOrders) {
              const env = {
                ...process.env,
                TO_PHONE:        o.customerPhone   || '',
                CUSTOMER_NAME:   o.customerName    || '',
                ORDER_ID:        o.orderId          || '',
                PICK_CODE:       o.pickCode         || '',
                LOCKER:          o.locker           || '',
                PICKUP_LOCATION: o.orderLocation    || '',
                PICKUP_DATE:     o.pickupDate       || '',
                PICKUP_TIME:     o.pickupTime       || '',
              };
              try {
                console.log('  Sending WhatsApp to ' + o.customerPhone + ' for order ' + o.orderId);
                execSync('node send_whatsapp.js', { env, stdio: 'inherit' });
                sent++;
              } catch (err) {
                console.log('  ⚠️  WhatsApp failed for order ' + o.orderId + ': ' + err.message);
                failed++;
              }
            }
            console.log('');
            console.log('📱 WhatsApp summary: ' + sent + ' sent, ' + failed + ' failed (email already delivered to all customers regardless).');
            process.exit(0);
          " || echo "⚠️  WhatsApp step encountered an unexpected error — continuing, since email delivery is unaffected."

      - name: Commit tracking files
        if: success() && steps.claim.outputs.claimed_count != '0' && steps.order_file.outputs.path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d pickup_codes ]; then git add -f pickup_codes/; fi
          if [ -d advance_queue ]; then git add -f advance_queue/; fi

          echo "📋 Git status after add:"
          git status

          # FIX 2026-09-21: the old version used `|| \` so only the
          # ORDERS_STR line was conditional and `git commit` ran every
          # time, failing when nothing was staged. Proper if/else now.
          if git diff --staged --quiet; then
            echo "⚠️ Nothing to commit — file unchanged"
          else
            ORDERS_STR=$(python3 -c "import json; o=json.load(open('/tmp/success_orders.json')); print(','.join([x.get('orderId','') for x in o]))" 2>/dev/null || echo "orders")
            git commit -m "Pickup codes generated for orders: $ORDERS_STR"
          fi

          # Retry push a few times — GitHub occasionally returns a
          # transient "Internal Server Error" on the remote side (not
          # caused by our data or logic). A short retry usually clears it
          # without needing manual re-triggering.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✅ Pushed successfully (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "❌ Push failed after 3 attempts — needs manual attention"
              exit 1
            fi
            echo "⚠️  Push attempt $attempt failed, retrying in 5s..."
            sleep 5
            if ! git pull --rebase origin main; then
              echo "⚠️  Rebase hit a real content conflict — attempting a safe data-level merge..."
              if node resolve_tracking_conflict.js; then
                export GIT_EDITOR=true
                git rebase --continue
              else
                echo "❌ Could not safely auto-merge — aborting rebase for manual resolution."
                git rebase --abort
                exit 1
              fi
            fi
          done
