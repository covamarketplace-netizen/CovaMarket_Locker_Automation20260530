name: Generate XYZ Vending Pickup Code

# Serialize runs — without this, two pushes close together can run at the
# same time and race over which order file gets processed, silently
# dropping one entirely. cancel-in-progress:false means queued runs wait
# their turn rather than getting cancelled.
concurrency:
  group: generate-pickup-code
  cancel-in-progress: false

on:
  push:
    paths:
      - 'order_consolidation/orders_*.json'
  workflow_dispatch:  # no inputs needed — everything comes from the order JSON

jobs:
  generate-pickup-code:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # need full history to diff against github.event.before

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install qrcode

      - name: Show current active_lockers.json
        run: |
          echo "📋 Current active_lockers.json:"
          cat pickup_codes/active_lockers.json 2>/dev/null || echo "(file does not exist yet)"

      - name: Resolve order file path
        id: order_file
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Process the file(s) THIS push actually added — not just
            # "newest file in the folder", which races with other pushes.
            FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'order_consolidation/orders_*.json' | tail -1)
          fi
          # Manual runs (workflow_dispatch) have no push diff to compare —
          # fall back to newest file in the folder.
          if [ -z "$FILE" ]; then
            FILE=$(ls order_consolidation/orders_*.json 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$FILE" ]; then echo "❌ No order file found in order_consolidation/"; exit 1; fi
          echo "path=$FILE" >> $GITHUB_OUTPUT
          echo "📋 Using order file: $FILE"

      - name: Sort & process incoming orders
        id: generate
        env:
          XZY_APP_ID:     ${{ secrets.XZY_APP_ID }}
          XZY_SECRET_KEY: ${{ secrets.XZY_SECRET_KEY }}
          ORDERS_FILE:    ${{ steps.order_file.outputs.path }}
        run: |
          set +e
          # Instant Pickup orders get processed immediately inside this
          # script (unchanged behavior). Advance Pickup orders get
          # bucketed by date+slot instead — no code generated here; that
          # happens later via release_slot1.yml / release_slot2.yml.
          node accumulate_advance_orders.js 2>&1 | tee /tmp/node_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "────────────────────────"

          # Extract OUTPUT_JSON lines to temp file
          grep "OUTPUT_JSON:" /tmp/node_output.txt | sed 's/OUTPUT_JSON://' > /tmp/jsons.txt
          echo "📦 JSON lines found: $(wc -l < /tmp/jsons.txt)"

          # Use node to parse results (avoids Python-in-YAML indentation issues)
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/jsons.txt','utf8').trim().split('\n').filter(Boolean);
            const results = [];
            let firstCode = '';
            for (const l of lines) {
              try {
                const d = JSON.parse(l);
                if (d.success) {
                  results.push(d);
                  if (!firstCode) firstCode = d.pickCode || '';
                }
              } catch(e) {}
            }
            fs.writeFileSync('/tmp/success_orders.json', JSON.stringify(results));
            fs.writeFileSync('/tmp/first_pick_code.txt', firstCode);
            console.log('Parsed ' + results.length + ' successful order(s), first code: ' + firstCode);
          "

          FIRST=$(cat /tmp/first_pick_code.txt 2>/dev/null || echo "")
          echo "pick_code=$FIRST" >> $GITHUB_OUTPUT
          echo "📋 First pick code: $FIRST"

          # Multiline delimiter for JSON output
          echo "success_orders<<EOF_ORDERS" >> $GITHUB_OUTPUT
          cat /tmp/success_orders.json >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF_ORDERS" >> $GITHUB_OUTPUT

          mkdir -p pickup_codes
          cp /tmp/success_orders.json pickup_codes/latest.json 2>/dev/null || echo "[]" > pickup_codes/latest.json

          echo "📋 active_lockers.json after script ran:"
          cat pickup_codes/active_lockers.json 2>/dev/null || echo "(MISSING)"

          exit $EXIT_CODE

      - name: Send pickup code emails to customers
        if: success() && steps.generate.outputs.pick_code != ''
        env:
          GMAIL_USER:     covamarketplace@gmail.com
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUCCESS_ORDERS: ${{ steps.generate.outputs.success_orders }}
        run: |
          echo "📧 Sending pickup code emails..."
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const orders = JSON.parse(fs.readFileSync('/tmp/success_orders.json', 'utf8'));
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const validOrders = orders.filter(o => {
              const email = (o.customerEmail || '').trim();
              if (!email || email === 'N/A' || !emailRegex.test(email)) {
                console.log('  ⚠️  Skipping order ' + o.orderId + ' — no valid email (got: ' + (o.customerEmail || 'empty') + ')');
                return false;
              }
              return true;
            });
            console.log('Sending ' + validOrders.length + ' email(s) (skipped ' + (orders.length - validOrders.length) + ' with missing/invalid email)...');
            for (const o of validOrders) {
              const env = {
                ...process.env,
                TO_EMAIL:        o.customerEmail || '',
                CUSTOMER_NAME:   o.customerName  || '',
                ORDER_ID:        o.orderId        || '',
                PICK_CODE:       o.pickCode       || '',
                LOCKER:          o.locker         || '',
                PICKUP_LOCATION: o.orderLocation  || '',
                PICKUP_DATE:     o.pickupDate     || '',
                PICKUP_TIME:     o.pickupTime     || '',
              };
              console.log('  Sending to ' + o.customerEmail + ' for order ' + o.orderId);
              execSync('node send_email.js', { env, stdio: 'inherit' });
            }
          "

      # ── WhatsApp sending DISABLED (2026-08-01) ──────────────────────────
      # Hit Twilio's free-tier daily cap (5 messages/day) and, since the
      # inline execSync calls aren't wrapped in try/catch, one failure
      # crashed this whole step and blocked every order after the first.
      # Re-enable once on a paid/production Twilio WhatsApp sender —
      # see send_whatsapp_production.js for the template-based version
      # needed for production anyway.
      #
      # - name: Send pickup code WhatsApp to customers
      #   if: success() && steps.generate.outputs.pick_code != ''
      #   env:
      #     TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      #     TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
      #     TWILIO_WA_FROM:     ${{ secrets.TWILIO_WA_FROM }}
      #   run: |
      #     echo "📱 Sending pickup code WhatsApp messages..."
      #     node -e "
      #       const { execSync } = require('child_process');
      #       const fs = require('fs');
      #       const orders = JSON.parse(fs.readFileSync('/tmp/success_orders.json', 'utf8'));
      #       const phoneRegex = /^\+\d{7,15}$/;
      #       const validOrders = orders.filter(o => {
      #         const phone = (o.customerPhone || '').trim();
      #         if (!phone || phone === 'N/A' || !phoneRegex.test(phone)) {
      #           console.log('  ⚠️  Skipping order ' + o.orderId + ' — no valid phone (got: ' + (o.customerPhone || 'empty') + ')');
      #           return false;
      #         }
      #         return true;
      #       });
      #       console.log('Sending ' + validOrders.length + ' WhatsApp(s) (skipped ' + (orders.length - validOrders.length) + ' with missing/invalid phone)...');
      #       for (const o of validOrders) {
      #         const env = {
      #           ...process.env,
      #           TO_PHONE:        o.customerPhone  || '',
      #           CUSTOMER_NAME:   o.customerName   || '',
      #           ORDER_ID:        o.orderId         || '',
      #           PICK_CODE:       o.pickCode        || '',
      #           LOCKER:          o.locker          || '',
      #           PICKUP_LOCATION: o.orderLocation   || '',
      #           PICKUP_DATE:     o.pickupDate      || '',
      #           PICKUP_TIME:     o.pickupTime      || '',
      #         };
      #         console.log('  Sending WhatsApp to ' + o.customerPhone + ' for order ' + o.orderId);
      #         execSync('node send_whatsapp.js', { env, stdio: 'inherit' });
      #       }
      #     "

      - name: Commit tracking files
        if: success() && steps.generate.outputs.pick_code != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f pickup_codes/active_lockers.json pickup_codes/latest.json advance_queue/

          echo "📋 Git status after add:"
          git status

          git diff --staged --quiet && echo "⚠️ Nothing to commit — file unchanged" || \
            ORDERS_STR=$(python3 -c "import json; o=json.load(open('/tmp/success_orders.json')); print(','.join([x.get('orderId','') for x in o]))" 2>/dev/null || echo "orders")
            git commit -m "Pickup codes generated for orders: $ORDERS_STR"

          git push origin main
