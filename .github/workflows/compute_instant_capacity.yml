name: Compute Instant Pickup Capacity

# Runs daily at 23:30 MYT (15:30 UTC) — same timing as the expired-pickup
# report, right after the 9PM advance-booking cutoff for tomorrow.
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

concurrency:
  group: compute-instant-capacity
  cancel-in-progress: false

jobs:
  compute-instant-capacity:
    runs-on: ubuntu-latest
    # Skips this entire job while Demo Mode is on (toggled via the
    # "Toggle Demo Mode" workflow) — prevents tomorrow's Instant Pickup
    # budget calc from touching the same 14 lockers a live demo is
    # using. Shows as "skipped" in the Actions UI, not failed.
    if: ${{ vars.DEMO_MODE_ACTIVE != 'true' }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compute tomorrow's Instant Pickup capacity
        run: node compute_instant_capacity.js

      - name: Commit updated capacity file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pickup_codes/instant_capacity.json
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Auto: compute instant pickup capacity [skip ci]"
          # Retry push a few times — GitHub occasionally returns a
          # transient "Internal Server Error" on the remote side (not
          # caused by our data or logic). A short retry usually clears it
          # without needing manual re-triggering.
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Pushed successfully (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "❌ Push failed after 3 attempts — needs manual attention"
              exit 1
            fi
            echo "⚠️  Push attempt $attempt failed, retrying in 5s..."
            sleep 5
            if ! git pull --rebase; then
              echo "⚠️  Rebase hit a real content conflict — attempting a safe data-level merge..."
              if node resolve_tracking_conflict.js; then
                export GIT_EDITOR=true
                git rebase --continue
              else
                echo "❌ Could not safely auto-merge — aborting rebase for manual resolution."
                git rebase --abort
                exit 1
              fi
            fi
          done
