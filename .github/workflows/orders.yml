name: Fetch Shopify Orders

on:
  workflow_dispatch:
  repository_dispatch:
    types: [shopify-order]      # <-- Lambda will send this event type

jobs:
  fetch-orders:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      GITHUB_TOKEN:          ${{ secrets.GH_PAT }}
      GITHUB_OWNER:          ${{ secrets.GH_OWNER }}
      GITHUB_REPO:           ${{ secrets.GH_REPO }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run the script
        run: node index.js
