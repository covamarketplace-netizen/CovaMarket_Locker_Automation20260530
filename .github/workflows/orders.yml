name: Fetch Shopify Orders

on:
  workflow_dispatch:        # lets you run it manually with a button
  schedule:
    - cron: '0 0 * * *'     # also runs automatically daily at 00:00 UTC

jobs:
  fetch-orders:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run the script
        run: node index.js
